services:

  postgres:
    image: postgres:16
    container_name: job-intelligence-postgres
    environment:
      POSTGRES_DB: job_intelligence
      POSTGRES_USER: job_user
      POSTGRES_PASSWORD: job_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: